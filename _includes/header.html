<script>
  /* Runs before the page paints so dark mode does not flash light first.
     A saved choice wins; otherwise follow the OS and keep following it. */
  (function () {
    var root = document.documentElement;
    var query = window.matchMedia('(prefers-color-scheme: dark)');
    function saved() {
      try { return localStorage.getItem('theme'); } catch (e) { return null; }
    }
    function apply(theme) {
      root.setAttribute('data-theme', theme);
      var btn = document.querySelector('.theme-toggle');
      if (btn) {
        btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
      }
    }
    apply(saved() || (query.matches ? 'dark' : 'light'));
    query.addEventListener('change', function (e) {
      if (!saved()) apply(e.matches ? 'dark' : 'light');
    });
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.querySelector('.theme-toggle');
      apply(root.getAttribute('data-theme'));
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        apply(next);
      });
    });
  })();
</script>
{%- comment -%} The build-time query string busts the Pages CDN, which kept serving the previous styles.css after a deploy. {%- endcomment -%}
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<header class="site-header" role="banner">
    <div class="site-header-inner">
        <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="Home">
            {% if site.logo %}
            <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo" width="168" height="112" decoding="async">
            {% endif %}
            <div class="site-title">{{ site.title }}</div>
        </a>
        <div class="site-sub">{{ site.tagline | default: site.description }}</div>
    </div>
    <div class="header-search-wrap">
        <form class="header-search-form" role="search" action="{{ '/search' | relative_url }}" method="get">
            <label for="header-search" class="sr-only">Search posts</label>
            <input id="header-search" class="header-search-input" type="search" name="q" placeholder="Search posts…" autocomplete="off">
            <button class="header-search-btn" type="submit" aria-label="Search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </form>
        <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
        </button>
    </div>
</header>
