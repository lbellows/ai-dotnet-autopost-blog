name: Daily AI Blog Post

on:
  schedule:
    # 12:00 UTC (07:00 EST / 08:00 EDT) on Tue & Thu (deep-dive posts) and Sun (week-in-review synopsis).
    # Cron is fixed UTC and does not follow DST, so the local time shifts an hour between winter/summer.
    # The generator switches to synopsis mode automatically on Sundays (see PromptBuilder.ModeInstructions).
    - cron: "0 12 * * 2,4,0"
  workflow_dispatch:
    inputs:
      ai_provider:
        description: "AI provider (leave on 'scheduled-default' to use the configured default)"
        required: false
        default: "scheduled-default"
        type: choice
        options:
          - scheduled-default
          - anthropic
          - foundry
          - venice

permissions:
  contents: write

env:
  # Single source of truth for which provider the scheduled run uses. Change this one line to
  # switch it. To toggle without a commit, set an AI_PROVIDER repository variable instead
  # (Settings -> Secrets and variables -> Actions -> Variables); it wins over this default.
  # A manual run can still override both by picking a provider from the menu above.
  DEFAULT_AI_PROVIDER: venice

jobs:
  write-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Resolve provider
        id: provider
        env:
          REQUESTED: ${{ inputs.ai_provider }}
          REPO_DEFAULT: ${{ vars.AI_PROVIDER }}
        run: |
          # Precedence: explicit menu choice > AI_PROVIDER repo variable > DEFAULT_AI_PROVIDER.
          # Scheduled runs supply no input, so they land on the configured default.
          PROVIDER="$REQUESTED"
          if [ -z "$PROVIDER" ] || [ "$PROVIDER" = "scheduled-default" ]; then
            PROVIDER="${REPO_DEFAULT:-$DEFAULT_AI_PROVIDER}"
          fi
          echo "Using provider: $PROVIDER"
          echo "name=$PROVIDER" >> "$GITHUB_OUTPUT"

      - name: Validate provider secrets
        env:
          PROVIDER: ${{ steps.provider.outputs.name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOUNDRY_OPENAI_ENDPOINT: ${{ secrets.FOUNDRY_OPENAI_ENDPOINT }}
          FOUNDRY_PROJECT_API_KEY: ${{ secrets.FOUNDRY_PROJECT_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
        run: |
          case "$PROVIDER" in
            anthropic|claude)
              [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Missing ANTHROPIC_API_KEY secret."; exit 1; }
              ;;
            foundry|azure)
              [ -n "$FOUNDRY_OPENAI_ENDPOINT" ] || { echo "::error::Missing FOUNDRY_OPENAI_ENDPOINT secret."; exit 1; }
              [ -n "$FOUNDRY_PROJECT_API_KEY" ] || { echo "::error::Missing FOUNDRY_PROJECT_API_KEY secret."; exit 1; }
              ;;
            venice)
              [ -n "$VENICE_API_KEY" ] || { echo "::error::Missing VENICE_API_KEY secret."; exit 1; }
              ;;
            *)
              echo "::error::Unknown provider: $PROVIDER"; exit 1
              ;;
          esac

      - name: Generate grounded article via Web Search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOUNDRY_OPENAI_ENDPOINT: ${{ secrets.FOUNDRY_OPENAI_ENDPOINT }}
          FOUNDRY_PROJECT_API_KEY: ${{ secrets.FOUNDRY_PROJECT_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          IMGFLIP_USERNAME: ${{ secrets.IMGFLIP_USERNAME }}
          IMGFLIP_PASSWORD: ${{ secrets.IMGFLIP_PASSWORD }}
          PROVIDER: ${{ steps.provider.outputs.name }}
        run: |
          dotnet --version | grep -q "^10\." || { echo "::error::.NET 10 not found on runner."; exit 1; }
          dotnet run --project BlogGenerator -- "$PROVIDER"

      - name: Commit & push if changed
        run: |
          git config user.name  "the.serf"
          git config user.email "the.serf@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add _posts
            git commit -m "chore(posts): daily AI article (web search)"
            git push
          else
            echo "No changes to commit."
          fi
